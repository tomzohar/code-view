# code-view CI — the validation ladder (docs/SDLC.md §1 Stage 4), enforced.
#
# Every gate step below invokes a `just` recipe and nothing else. That is
# deliberate: docs/SDLC.md §2 makes the justfile the single entry point so the
# command CI runs is byte-identical to the command an agent runs locally. If you
# find yourself reaching for `cargo` in this file, add a recipe instead — a gate
# that can only be reproduced by reading YAML is a gate nobody reproduces.
#
# Rungs: L0 fmt+clippy · L1 tests · L2 PTY e2e · L3 perf budgets.
# L4 (adversarial agent review) is CV-033; L5 (human review in cv) needs M2.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No secrets are used or needed anywhere in this repo (docs/SDLC.md §3).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are wasted work. Runs on main are the record of whether
  # each merged commit was green, so they are never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: L0+L1 check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure shouldn't hide another's — cross-platform bugs
      # travel in packs.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Resolves the channel and components from rust-toolchain.toml rather than
      # naming a version here, so a toolchain bump stays a one-line PR that
      # cannot drift from what agents run locally.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Lockfile is current
        run: just lock-check

      - name: fmt + clippy + tests
        run: just check

  e2e:
    name: L2 e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Unix only for now. expectrl's Windows ConPTY support is the least mature
      # part of that crate, and a flaky gate is a P1 bug (docs/SDLC.md §1).
      # Windows PTY coverage is CV-030 — to be added when it can be reliable.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: PTY scenarios
        run: just e2e

  perf:
    name: L3 performance budgets
    runs-on: ubuntu-latest
    steps:
      # The gate benchmarks the merge base too, so the history has to reach it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,hyperfine

      # Proves the gate can still fail before trusting it to pass. Cheap
      # insurance against a perf gate that silently stops gating.
      - name: Self-test the perf gates
        run: just perf-gate-selftest

      - name: Cold-start budget (ARCHITECTURE.md §4)
        run: just coldstart

      # Both sides of the comparison are measured here, on this runner, back to
      # back — see the `bench-gate-ci` recipe for why anything else flakes.
      - name: Criterion regression gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: just bench-gate-ci "$BASE_SHA"

      # Nothing to compare against post-merge, but the benches must still build
      # and run — a bench that stops compiling is invisible until the next PR.
      - name: Benchmarks still run
        if: github.event_name == 'push'
        run: just bench

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # install-action has no actionlint recipe, and its cargo-binstall fallback
      # cannot help: actionlint is Go and was never published to crates.io. So
      # take the release binary straight from upstream, at a pinned version for
      # the same reason rust-toolchain.toml pins rustc — a linter that silently
      # changes version changes the gate.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint --version

      - name: actionlint
        run: just lint-workflows
