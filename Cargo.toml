[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/tomzohar/code-view"
authors = ["code-view contributors"]

# Single source of truth for dependency versions. Member crates use
# `dep = { workspace = true }` so upgrades happen in one place.
# The stack itself is fixed by ADR-0001; adding a *new* entry here needs an ADR.
[workspace.dependencies]
# workspace crates (dependency arrows point down only — see docs/ARCHITECTURE.md §1)
cv-core = { path = "crates/cv-core" }
cv-vcs = { path = "crates/cv-vcs" }
cv-watch = { path = "crates/cv-watch" }
cv-syntax = { path = "crates/cv-syntax" }
cv-bridge = { path = "crates/cv-bridge" }
cv-ui = { path = "crates/cv-ui" }

# external
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
gix = { version = "0.74", default-features = false, features = ["max-performance-safe"] }
imara-diff = "0.2"
notify = "8"
ratatui = "0.29"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tree-sitter = "0.25"

# dev / validation ladder (docs/SDLC.md §1)
criterion = "0.7"
expectrl = "0.7"
insta = "1"
proptest = "1"

# Lints are declared once and inherited by every crate via `[lints] workspace = true`.
# CI runs `cargo clippy -- -D warnings`; keep this list honest rather than silencing it.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Benchmarks and cold-start checks must measure release-grade code.
[profile.bench]
lto = "thin"
codegen-units = 1
