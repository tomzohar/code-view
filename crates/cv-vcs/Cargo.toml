[package]
name = "cv-vcs"
description = "Git access for code-view: status, diffs and file content via gitoxide."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Criterion owns benchmarking in this workspace; libtest's harness must stay out
# of `cargo bench`, or it rejects criterion's flags and fails the L3 gate (CV-002).
[lib]
bench = false

[dependencies]
gix = { workspace = true }
thiserror = { workspace = true }
