[package]
name = "cv-app"
description = "code-view (cv) — a code and diff viewer for the terminal, built for AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# `bench = false` on every non-criterion target: `cargo bench` would otherwise
# run libtest's harness here too, and libtest rejects criterion's flags — which
# breaks `just bench-gate` outright (CV-002).
[[bin]]
name = "cv"
path = "src/main.rs"
bench = false

[[test]]
name = "e2e"
harness = true
bench = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
cv-bridge = { workspace = true }
cv-core = { workspace = true }
cv-ui = { workspace = true }
cv-vcs = { workspace = true }
cv-watch = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
expectrl = { workspace = true }
