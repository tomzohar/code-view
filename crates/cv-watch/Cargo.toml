[package]
name = "cv-watch"
description = "Debounced filesystem and git-state watching for code-view."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Criterion owns benchmarking in this workspace; libtest's harness must stay out
# of `cargo bench`, or it rejects criterion's flags and fails the L3 gate (CV-002).
[lib]
bench = false

[dependencies]
notify = { workspace = true }
thiserror = { workspace = true }
